<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      :root {
        --bg: #ffffff;
        --group-fill: #f6f8fa;
        --group-stroke: #d0d7de;
        --box-fill: #ffffff;
        --box-stroke: #57606a;
        --accent-fill: #ddf4ff;
        --accent-stroke: #0969da;
        --pin-fill: #fff1e5;
        --pin-stroke: #bc4c00;
        --text: #24292f;
        --muted: #57606a;
        --line: #57606a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --group-fill: #161b22;
          --group-stroke: #30363d;
          --box-fill: #21262d;
          --box-stroke: #8b949e;
          --accent-fill: #0c2d48;
          --accent-stroke: #58a6ff;
          --pin-fill: #3a2412;
          --pin-stroke: #d29922;
          --text: #e6edf3;
          --muted: #8b949e;
          --line: #8b949e;
        }
      }
      rect.bg { fill: var(--bg); }
      rect.group { fill: var(--group-fill); stroke: var(--group-stroke); stroke-width: 1.5; }
      rect.box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
      rect.accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.5; }
      rect.pin { fill: var(--pin-fill); stroke: var(--pin-stroke); stroke-width: 1.5; }
      text { fill: var(--text); }
      text.muted { fill: var(--muted); font-size: 12px; }
      text.title { font-size: 15px; font-weight: 600; }
      text.mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px; }
      text.grouplabel { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; fill: var(--muted); text-transform: uppercase; }
      .arrowhead { fill: var(--line); }
      line.flow, path.flow { stroke: var(--line); stroke-width: 1.75; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="460"/>

  <!-- WSL group -->
  <rect class="group" x="20" y="50" width="270" height="340" rx="10"/>
  <text class="grouplabel" x="40" y="78">WSL (Linux)</text>

  <rect class="box" x="45" y="95" width="220" height="60" rx="8"/>
  <text class="title" x="155" y="120" text-anchor="middle">ssh / oc / aws / scp&#8230;</text>
  <text class="muted" x="155" y="140" text-anchor="middle">any tool reading SSH_AUTH_SOCK</text>

  <line class="flow" x1="155" y1="155" x2="155" y2="200"/>

  <rect class="box" x="45" y="205" width="220" height="60" rx="8"/>
  <text class="mono" x="155" y="230" text-anchor="middle">socat UNIX-LISTEN:</text>
  <text class="mono" x="155" y="248" text-anchor="middle">$SSH_AUTH_SOCK,fork</text>

  <line class="flow" x1="155" y1="265" x2="155" y2="310"/>

  <rect class="accent" x="45" y="315" width="220" height="60" rx="8"/>
  <text class="mono" x="155" y="340" text-anchor="middle">EXEC:"keybridge.exe</text>
  <text class="mono" x="155" y="358" text-anchor="middle">relay //./pipe/&#8230;"</text>

  <!-- crossing arrow: WSL -> Windows -->
  <path class="flow" d="M 290 345 C 340 345, 340 345, 390 345"/>
  <text class="muted" x="340" y="335" text-anchor="middle">WSL interop</text>

  <!-- Windows group -->
  <rect class="group" x="400" y="50" width="290" height="340" rx="10"/>
  <text class="grouplabel" x="420" y="78">Windows</text>

  <rect class="accent" x="425" y="315" width="240" height="60" rx="8"/>
  <text class="mono" x="545" y="340" text-anchor="middle">keybridge.exe (the agent)</text>
  <text class="mono" x="545" y="358" text-anchor="middle">\\.\pipe\openssh-ssh-agent</text>

  <line class="flow" x1="545" y1="315" x2="545" y2="270"/>

  <rect class="box" x="425" y="205" width="240" height="60" rx="8"/>
  <text class="title" x="545" y="230" text-anchor="middle">Windows CryptoAPI / CNG</text>
  <text class="muted" x="545" y="248" text-anchor="middle">CryptSignMessage, never exports the key</text>

  <line class="flow" x1="545" y1="205" x2="545" y2="160"/>

  <rect class="pin" x="425" y="95" width="240" height="60" rx="8"/>
  <text class="title" x="545" y="118" text-anchor="middle">Cert Store / PIV smart card</text>
  <text class="muted" x="545" y="138" text-anchor="middle">PIN prompt happens here</text>

  <!-- SSH server -->
  <rect class="box" x="740" y="205" width="140" height="60" rx="8"/>
  <text class="title" x="810" y="230" text-anchor="middle">SSH</text>
  <text class="title" x="810" y="248" text-anchor="middle">server</text>

  <path class="flow" d="M 665 235 C 700 235, 705 235, 735 235"/>
  <text class="muted" x="700" y="200" text-anchor="middle">signed challenge</text>
</svg>
